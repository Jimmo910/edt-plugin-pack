name: Auto-update plugins

on:
  schedule:
    - cron: '0 6 * * 1'   # понедельник 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  ECLIPSE_URL: "https://archive.eclipse.org/eclipse/downloads/drops4/R-4.36-202505281830/eclipse-platform-4.36-win32-x86_64.zip"

jobs:
  # 1) Проверка обновлений по таргету: бампит манифест локально, отдаёт его + флаги артефактом.
  bump:
    strategy:
      fail-fast: false
      matrix:
        target: ['2026.1', '2026.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: chk
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: manifests/${{ matrix.target }}.json
        run: ./scripts/check-updates.ps1
      # ВАЖНО: outputs шага подставляем через env, а НЕ через ${{ }} прямо в скрипт.
      # summary строится из tag_name СТОРОННИХ репозиториев (check-updates.ps1), то есть это
      # недоверенные данные: тег вида `v1.0"; curl … | sh; "` иначе исполнился бы в шаге,
      # у которого есть GITHUB_TOKEN с правами contents/issues: write.
      - name: Собрать meta-артефакт
        shell: bash
        env:
          CHANGED: ${{ steps.chk.outputs.changed }}
          VERSION: ${{ steps.chk.outputs.version }}
          SUMMARY: ${{ steps.chk.outputs.summary }}
          TARGET:  ${{ matrix.target }}
        run: |
          mkdir -p out
          printf '%s\n' "$CHANGED" > out/changed.txt
          printf '%s\n' "$VERSION" > out/version.txt
          printf '%s\n' "$SUMMARY" > out/summary.txt
          cp "manifests/$TARGET.json" out/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.target }}
          path: out/

  # 2) Барьер: собираем бампы всех линий в один набор манифестов и выравниваем версию.
  #    check-updates.ps1 бампит package.version в СВОЁМ манифесте, а линии обновляются
  #    независимо (составы у них расходятся). Версия набора одна и входит в имя архива,
  #    поэтому выравнивать надо ДО сборки: иначе в релизе v2.0.1 оказался бы
  #    EDT-Plugin-Pack-2026.1-2.0.0.zip, а README.txt внутри ссылался бы на чужое имя.
  sync:
    needs: bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.s.outputs.changed }}
      version: ${{ steps.s.outputs.version }}
      summary: ${{ steps.s.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: meta
      - id: s
        shell: bash
        run: |
          set -euo pipefail
          # Сверяем ИМЕНА линий, а не количество: пара «лишний манифест + пропавший артефакт»
          # по счёту сошлась бы, а по сути это расхождение матрицы target с manifests/.
          have=$(find meta -mindepth 1 -maxdepth 1 -type d -name 'meta-*' -printf '%f\n' | sed 's/^meta-//' | sort | tr '\n' ' ')
          want=$(ls -1 manifests/*.json | xargs -n1 basename | sed 's/\.json$//' | sort | tr '\n' ' ')
          [ "$have" = "$want" ] || { echo "линии в артефактах [$have] != манифесты [$want]: матрица target разошлась с manifests/"; exit 1; }
          # Расхождение версий В РЕПОЗИТОРИИ фиксируем ДО того, как накатим бампы. Код возврата
          # -Check не зависит от текста сообщений (grep по русской строке был бы хрупким).
          if pwsh -NoProfile -File scripts/sync-version.ps1 -Check >/dev/null 2>&1; then DIVERGED=0; else DIVERGED=1; fi
          # Линии не захардкожены: разбираем всё, что положил bump (meta/meta-<линия>/).
          SUM=""
          for d in meta/meta-*/; do
            line=$(basename "$d"); line=${line#meta-}
            [ "$(cat "$d/changed.txt")" = "true" ] || continue
            cp "$d/manifest.json" "manifests/$line.json"
            SUM="$SUM $line: $(cat "$d/summary.txt");"
          done
          pwsh -NoProfile -File scripts/sync-version.ps1 >sv.out 2>sv.err || { cat sv.err; exit 1; }
          VER=$(cat sv.out); cat sv.err
          if [ -n "$SUM" ]; then CH=true; else CH=false; fi
          # Если версии разъехались, а бампов нет, commit-release не запустится: выравнивание
          # останется только в артефакте, а в git расхождение переживёт прогон и позже уронит
          # release-шаг build-release далеко от причины. Это состояние требует человека, поэтому
          # валим job (issue заведёт on-failure), а не пишем предупреждение в зелёный прогон.
          if [ "$DIVERGED" = 1 ] && [ "$CH" != "true" ]; then
            echo "package.version в manifests/ разъехались, а обновлений нет — выравнивание не будет закоммичено. Поправьте версии в репозитории вручную."
            exit 1
          fi
          # summary — недоверенные данные (собран из tag_name чужих репозиториев), поэтому
          # многострочной формой с делимитером: перевод строки в `key=value` подменил бы outputs.
          # Делимитер уникальный: с фиксированным значение, содержащее эту же строку, закрыло бы
          # блок досрочно и подменило соседние outputs (например version=, который станет тегом).
          D="EOF_SUMMARY_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "changed=$CH"
            echo "version=$VER"
            printf 'summary<<%s\n%s\n%s\n' "$D" "$SUM" "$D"
          } >> "$GITHUB_OUTPUT"
          echo "версия набора: $VER; изменения:${SUM:- нет}"
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: manifests/

  # 3) Сборка с (возможно) обновлёнными манифестами — берём их из артефакта sync.
  build:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        target: ['2026.1', '2026.2']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      # Тест на фикстурах гоняем и здесь: этот workflow еженедельно правит README через
      # sync-readme.ps1, и регресс в нём иначе всплыл бы только при ручном build-release.
      # Гейт `-Check` тут неприменим: манифесты уже забампаны, а README синхронизируется позже.
      - name: Тест sync-readme
        shell: pwsh
        run: .\scripts\tests\sync-readme.tests.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Скачать Eclipse Platform
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:ECLIPSE_URL -OutFile "$env:RUNNER_TEMP\eclipse.zip" -UseBasicParsing
          Expand-Archive "$env:RUNNER_TEMP\eclipse.zip" "$env:RUNNER_TEMP\ecl" -Force
          "ECLIPSE_HOME=$(Join-Path "$env:RUNNER_TEMP\ecl" 'eclipse')" >> $env:GITHUB_ENV
      # Отдельными шагами по той же причине, что и гейты в build-release.yml: в одном блоке
      # код возврата упавшего скрипта может быть перезатёрт следующей командой. Здесь сегодня
      # спасал бы стиль (build/ci-validate сигналят throw, а не exit), но инвариант хрупкий.
      - name: Собрать набор (${{ matrix.target }})
        shell: pwsh
        run: .\scripts\build.ps1 -Target ${{ matrix.target }}
      - name: Валидация p2-метаданных
        shell: pwsh
        env:
          MANIFEST: manifests/${{ matrix.target }}.json
        run: .\scripts\ci-validate.ps1
      - name: Подготовить артефакт
        shell: pwsh
        run: Copy-Item build\ius.txt build\dist\
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.target }}
          path: build/dist/*
          if-no-files-found: error

  # 4) Verify на реальной EDT (self-hosted). Если упадёт — job красный, release не будет.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: ['2026.1', '2026.2']
    runs-on: [self-hosted, edt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pack-${{ matrix.target }}
          path: artifact
      - name: Verify install on EDT ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          EDT_HOME=$(ls -d /opt/1C/1CE/components/1c-edt-${{ matrix.target }}* 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$EDT_HOME" ] || { echo "EDT ${{ matrix.target }} не установлена на раннере"; exit 1; }
          ZIP=$(ls -1 artifact/*.zip); ZIP=${ZIP%%$'\n'*}
          IUS=$(tr -d '\r' < artifact/ius.txt | paste -sd, -)
          chmod +x scripts/verify.sh
          export VERIFY_SANDBOX="/tmp/verify-${{ matrix.target }}-${GITHUB_RUN_ID}"
          scripts/verify.sh "$EDT_HOME" "jar:file:$(realpath "$ZIP")!/" "$IUS"

  # 5) Коммит бампов в main + ОДИН релиз со всеми архивами — только если verify прошёл
  #    И что-то изменилось (иначе job просто пропускается).
  commit-release:
    needs: [sync, verify]
    if: ${{ needs.sync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.cr.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Теги и история нужны для «Что изменилось» в описании релиза и для CHANGELOG.md.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: synced
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: artifacts
          merge-multiple: true
      - name: Commit bumps & combined release
        id: cr
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.sync.outputs.version }}
          SUM: ${{ needs.sync.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # манифесты копируем ПОСЛЕ checkout: он бы затёр их содержимым origin/main
          cp synced/*.json manifests/
          git add manifests
          pwsh scripts/sync-readme.ps1   # привести версии в README к манифестам
          git add README.md
          # Идемпотентность: если push уже прошёл, а следующий шаг упал (сеть/лимит) и job
          # перезапустили, коммитить нечего — раньше git commit возвращал 1, set -e ронял job,
          # заводился issue «не прошло», хотя бампы уже в main, а релиза всё ещё нет.
          if git diff --cached --quiet; then
            echo "нечего коммитить: main уже содержит эти бампы (повторный запуск job)"
          else
            git commit -m "chore: авто-обновление —$SUM"
            # CHANGELOG собирается ПОСЛЕ коммита (чтобы он видел сам бамп) и вливается в него
            # amend'ом — до push, поэтому переписывания опубликованной истории тут нет.
            bash scripts/changelog.sh "$VER"
            git add CHANGELOG.md
            git diff --cached --quiet || git commit --amend --no-edit
            git push origin main
          fi
          TAG="v$VER"
          # Матрица target и manifests/ — два разных источника правды о наборе линий. Если они
          # разошлись (добавили манифест, забыли матрицу), релиз молча уехал бы без архива,
          # но с его описанием в теле релиза.
          for mf in manifests/*.json; do
            line=$(jq -r .package.edtLine "$mf")
            [ -f "artifacts/EDT-Plugin-Pack-$line-$VER.zip" ] || { echo "нет архива для линии $line: матрица target разошлась с manifests/"; exit 1; }
          done
          ZIPS=$(ls artifacts/*.zip)
          NOTES=$(bash scripts/release-notes.sh "$VER" "Авто-обновление:$SUM")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ZIPS --clobber
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" $ZIPS --title "$TAG" --notes "$NOTES"
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

  # 6) Публикация update site на Pages — только если релиз реально был.
  publish-pages:
    needs: commit-release
    if: ${{ needs.commit-release.outputs.released == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml

  # 7) Если что-то упало ИЛИ было отменено — issue.
  #    failure() ложен, когда прогон ОТМЕНЁН: так бывает, если verify сутки ждёт
  #    мёртвого self-hosted runner'а и GitHub убивает job по 24ч-таймауту очереди.
  #    Раньше issue в этом случае не заводился и поломка жила незамеченной
  #    (прогон 29729125446 от 2026-07-20: verify cancelled, on-failure skipped).
  #    always() + разбор needs.*.result ловит оба исхода.
  on-failure:
    needs: [bump, sync, build, verify, commit-release, publish-pages]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO обязателен: в этом job'е нет checkout, git-remote отсутствует, а
          # GITHUB_REPOSITORY сам gh не читает — без него любая команда gh без --repo
          # падает с «could not determine base repo».
          GH_REPO:  ${{ github.repository }}
          R_BUMP:    ${{ needs.bump.result }}
          R_SYNC:    ${{ needs.sync.result }}
          R_BUILD:   ${{ needs.build.result }}
          R_VERIFY:  ${{ needs.verify.result }}
          R_COMMIT:  ${{ needs.commit-release.result }}
          R_PAGES:   ${{ needs.publish-pages.result }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Причину берём из результатов job'ов. Раньше текст был один на все случаи и отправлял
          # читателя смотреть verify, даже когда упал bump или sync.
          BAD=""
          for j in "bump:$R_BUMP" "sync:$R_SYNC" "build:$R_BUILD" "verify:$R_VERIFY" "commit-release:$R_COMMIT" "publish-pages:$R_PAGES"; do
            case "${j#*:}" in failure|cancelled) BAD="$BAD ${j%%:*}(${j#*:})";; esac
          done
          if [ "$R_VERIFY" = "cancelled" ]; then
            TITLE="Авто-обновление зависло: verify не дождался runner'а"
            BODY=$(printf '%s\n' \
              "Состояние job'ов:$BAD" \
              "" \
              "Job \`verify\` отменён. Обычная причина — self-hosted runner с меткой \`edt\` был offline," \
              "и job простоял в очереди до 24-часового таймаута GitHub (если прогон отменили руками," \
              "issue можно закрыть). Релиза не было." \
              "" \
              "Что проверить:" \
              "1. Статус runner'а: \`gh api repos/$GITHUB_REPOSITORY/actions/runners\`" \
              "2. Если offline — на LXC 107 поднять службу:" \
              "   \`cd /opt/actions-runner && ./svc.sh start\`, лог — \`journalctl -u actions.runner.* -n 50\`" \
              "3. Если сервер переезжал — сначала погасить службу на старом хосте, иначе runner" \
              "   получит SessionConflictException (см. историю: служба умирала насмерть).")
          else
            # Заголовок фиксированный (без даты и без списка job'ов): иначе каждая новая
            # комбинация отказов создавала бы отдельный issue и дедупликация не работала бы.
            TITLE="Авто-обновление не прошло"
            BODY=$(printf '%s\n' \
              "Упавшие job'ы:$BAD" \
              "" \
              "Где смотреть в зависимости от job'а:" \
              "- \`bump\` — источник обновлений не ответил (лимит GitHub API, сеть, переименованный" \
              "  репозиторий/ассет) либо пакет GitLab не найден. Проверка считается неполной и" \
              "  сознательно валится: «обновлений нет» в такой ситуации недостоверно." \
              "- \`sync\` — либо линии в артефактах разошлись с \`manifests/\`, либо \`package.version\`" \
              "  в манифестах разъехались при отсутствии бампов (нужна ручная правка версий)." \
              "- \`build\` — сборка/валидация p2 или упавший тест \`scripts/tests/\`." \
              "- \`verify\` — набор не встал на реальную EDT (обычно несовместимая новая версия плагина)." \
              "- \`commit-release\`/\`publish-pages\` — публикация; бампы могли уже уехать в main." \
              "" \
              "Перезапускать лучше «Re-run all jobs»: при повторе только упавших job'ов" \
              "\`upload-artifact@v4\` упрётся в конфликт уже загруженного артефакта.")
          fi
          BODY="$BODY

          Лог прогона: $LOG"
          # Дедупликация: заголовок без даты, и если такой issue уже открыт — комментируем его,
          # а не плодим новый. Иначе вечная поломка (мёртвый апстрим, разъехавшиеся версии)
          # давала бы по issue каждый понедельник.
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,title \
                  --jq "map(select(.title==\"$TITLE\")) | .[0].number // empty" || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Повторилось:$BAD — $LOG"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
